<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Slider - Main</title>
  <link rel="stylesheet" href="mainstyle.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" />
</head>
<body>

  <!-- Top Navigation / Header -->
  <header>
    <a href="index.html" class="logout-btn">Logout</a>
  </header>

  <!-- Carousel Section -->
  <section class="wrapper">
    <i class="fa-solid fa-arrow-left button" id="prev"></i>
    
    <div class="image-container">
      <!-- Carousel is now empty; dynamic slides will render here -->
      <div class="carousel"></div>
    </div>

    <i class="fa-solid fa-arrow-right button" id="next"></i>
  </section>

  <!-- Upload & Delete Controls Container -->
  <div class="upload-container">
    <input 
      type="text" 
      id="caption-input" 
      placeholder="Enter caption for photo..." 
    />

    <div class="button-group">
  <!-- Hidden file input -->
  <input type="file" id="actual-btn" accept="image/*" hidden />
  
  <!-- Upload Button Label (MUST have for="actual-btn") -->
  <label for="actual-btn" class="upload-btn">Upload Photo</label>
  
  <!-- Delete Button -->
  <button id="delete-trigger-btn" class="delete-trigger-btn">
    <i class="fa-solid fa-trash"></i> Delete Photo
  </button>
</div>

    <span id="file-chosen">No file chosen</span>
  </div>

  <!-- Delete Selection Modal -->
  <div id="delete-modal" class="modal">
    <div class="modal-content">
      <h3>Select a photo to delete</h3>
      <select id="delete-photo-select">
        <option value="" disabled selected>-- Choose a photo --</option>
      </select>
      <div class="modal-actions">
        <button id="confirm-delete-btn" class="btn-danger">Delete Selected</button>
        <button id="cancel-delete-btn" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Background Audio -->
  <audio id="bg-music" controls autoplay loop hidden>
    <source src="audio/Portrait of Time - Aakash Gandhi.mp3" type="audio/mp3">
  </audio>

  <!-- JavaScript Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="mainpage.js"></script>
  <script defer src="auth.js"></script>
  <script defer src="init.js"></script>

</body>
</html>
